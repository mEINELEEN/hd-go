<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Этот тег критически важен для работы на мобильных устройствах! -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Электронная приемная обращений</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Официальная шапка на всю ширину экрана -->
<div class="top-bar">
    <h1>Единая система обращений для ГУ Минюста России по СПб и ЛО</h1>
</div>

<div class="container">
    <!-- Форма Авторизации -->
    <div id="auth-box">
        <h2 id="auth-title">Вход в систему</h2>
        <div class="form-group">
            <label>Логин сотрудника</label>
            <input type="text" id="username" placeholder="Введите логин">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="password" placeholder="Введите пароль">
        </div>
        <div class="form-group hidden" id="role-group">
            <label>Уровень доступа</label>
            <select id="role">
                <option value="user">Пользователь</option>
                <option value="admin">Администратор</option>
            </select>
        </div>
        <button id="auth-btn" onclick="submitAuth()">Войти</button>
        <div class="nav-links">
            <a id="toggle-auth" onclick="toggleAuthMode()">Регистрация нового заявителя</a>
        </div>
    </div>

    <!-- Личный кабинет и Заявки -->
    <div id="app-box" class="hidden">
        
        <div class="app-header">
            <h2 style="margin: 0;">Рабочий кабинет: <span id="user-display" style="color: var(--mj-gold);"></span></h2>
            <button onclick="logout()" class="btn-danger">Завершить сеанс</button>
        </div>

        <div id="create-ticket-section">
            <h3 style="color: var(--mj-blue);">Направить новое обращение</h3>
            <div class="form-group">
                <label>Тема обращения</label>
                <input type="text" id="ticket-title" placeholder="Краткая суть проблемы">
            </div>
            <div class="form-group">
                <label>Подробное описание</label>
                <textarea id="ticket-desc" placeholder="Опишите ситуацию во всех подробностях..."></textarea>
            </div>
            <button onclick="createTicket()">Зарегистрировать обращение</button>
            <hr style="border: 0; border-top: 1px solid #ccd5df; margin: 30px 0;">
        </div>

        <h3 style="color: var(--mj-blue); margin-bottom: 15px;">Реестр обращений</h3>
        <div id="tickets-list"></div>
    </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
