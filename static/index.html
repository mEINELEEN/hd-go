<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Helpdesk Система</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <!-- Форма Авторизации -->
    <div id="auth-box">
        <h2 id="auth-title">Вход в Helpdesk</h2>
        <div class="form-group">
            <label>Логин</label>
            <input type="text" id="username">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="password">
        </div>
        <div class="form-group hidden" id="role-group">
            <label>Роль</label>
            <select id="role">
                <option value="user">Пользователь</option>
                <option value="admin">Администратор</option>
            </select>
        </div>
        <button id="auth-btn" onclick="submitAuth()">Войти</button>
        <div class="nav-links">
            <a id="toggle-auth" onclick="toggleAuthMode()">Зарегистрироваться</a>
        </div>
    </div>

    <!-- Личный кабинет и Заявки -->
    <div id="app-box" class="hidden">
        <h2>Заявки (<span id="user-display"></span>)</h2>
        <button onclick="logout()" style="background: #dc3545; margin-bottom: 20px;">Выйти</button>

        <div id="create-ticket-section">
            <h3>Создать заявку</h3>
            <div class="form-group">
                <input type="text" id="ticket-title" placeholder="Тема проблемы">
            </div>
            <div class="form-group">
                <textarea id="ticket-desc" placeholder="Описание проблемы..."></textarea>
            </div>
            <button onclick="createTicket()">Отправить заявку</button>
            <hr style="margin: 20px 0;">
        </div>

        <h3>Список заявок</h3>
        <div id="tickets-list"></div>
    </div>
</div>

<script src="scripts.js"></script>
</body>
</html>
